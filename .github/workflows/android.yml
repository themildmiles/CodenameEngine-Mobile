name: Android Build
on:
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: macos-15
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Restore existing build cache for faster compilation
        id: cache-build
        uses: actions/cache@v4.2.3
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: cache-build-android
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
      - name: Install Libraries (if cache fails)
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          haxelib git openfl https://github.com/HomuHomu833-haxe-stuff/cne-openfl --quiet
          haxelib git lime https://github.com/HomuHomu833-haxe-stuff/lime --quiet
          
          # Flixel
          haxelib git flixel https://github.com/HomuHomu833-haxe-stuff/cne-flixel --quiet
          haxelib git flixel-addons https://github.com/HomuHomu833-haxe-stuff/cne-flixel-addons --quiet
          
          # Other Libraries
          haxelib git hscript-improved https://github.com/CodenameCrew/hscript-improved codename-dev --quiet
          haxelib git flxanimate https://github.com/CodenameCrew/cne-flxanimate --quiet
          haxelib git hxdiscord_rpc https://github.com/CodenameCrew/cne-hxdiscord_rpc --quiet
          haxelib install funkin-modchart 1.2.4 --quiet
          haxelib git hxvlc https://github.com/HomuHomu833-haxe-stuff/cne-hxvlc --quiet
          
          # Documentation and other features
          haxelib git away3d https://github.com/CodenameCrew/away3d --quiet
          # haxelib install dox --quiet
          haxelib install markdown --quiet
          haxelib install hxcpp-debug-server --quiet
          
          haxelib install nape-haxe4 --quiet
          
          haxelib git format https://github.com/HomuHomu833-haxe-stuff/format --quiet
          haxelib git hxp https://github.com/HomuHomu833-haxe-stuff/hxp --quiet
          
          haxelib git hxcpp https://github.com/HomuHomu833-haxe-stuff/hxcpp --quiet
      - run: |
          echo "HXCPP_COMPILE_CACHE=~/.hxcpp" >> $GITHUB_ENV
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s
      - name: Configuring Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true
      - name: Building the game
        run: haxelib run lime build android -final
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Uploading new cache
        uses: actions/cache@v4.2.3
        with:
          # caching again since for some reason it doesnt work with the first post cache shit
          key: cache-build-android
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/